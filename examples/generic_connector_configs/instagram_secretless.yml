version: 2
services:
  instagram-oauth2:
    connector: generic_http
    listenOn: tcp://0.0.0.0:8023
    credentials:
      token:
        from: keychain
        get: service#instagram/token
    config:
      headers:
        Authorization: OAuth {{ .token }}
      forceSSL: true
      upstreamURL: "https://graph.instagram.com"
      authenticateURLsMatching:
        - ^http[s]*
