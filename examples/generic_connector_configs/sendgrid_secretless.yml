version: 2
services:
  generic-oauth2:
    connector: generic_http
    listenOn: tcp://0.0.0.0:8071
    credentials:
      token:
        from: keychain
        get: service#sendgrid/token
    config:
      headers:
        Authorization: Bearer {{ .token }}
      forceSSL: true
      upstreamURL: "https://api.sendgrid.com"
      authenticateURLsMatching:
        - ^https?://api\.sendgrid\.com(/|$)
