version: 2

services:
  # Injects basic auth credentials and uses http on upstream connection.
  basic_auth_http:
    connector: generic_http
    listenOn: tcp://0.0.0.0:8080
    credentials:
      username: someuser
      password: testpassword
    config:
      credentialPatterns:
        username: '[^:]+'
      headers:
        Authorization: ' Basic {{ printf "%s:%s" .username .password | base64 }}'
      authenticateURLsMatching:
        - ^http
      forceSSL: false

  # Same as basic_auth_http above, but forces https on upstream connection
  basic_auth_https:
    connector: generic_http
    listenOn: tcp://0.0.0.0:8081
    credentials:
      username: someuser
      password: testpassword
    config:
      credentialPatterns:
        username: '[^:]+'
      headers:
        Authorization: ' Basic {{ printf "%s:%s" .username .password | base64 }}'
      authenticateURLsMatching:
        - ^http
      forceSSL: true

  # Does not set forceSSL, exercising the secure default (forceSSL: true).
  # Requests to a plaintext http upstream must be rejected, never forwarded
  # with credentials in cleartext.
  basic_auth_default:
    connector: generic_http
    listenOn: tcp://0.0.0.0:8082
    credentials:
      username: someuser
      password: testpassword
    config:
      credentialPatterns:
        username: '[^:]+'
      headers:
        Authorization: ' Basic {{ printf "%s:%s" .username .password | base64 }}'
      authenticateURLsMatching:
        - ^http
